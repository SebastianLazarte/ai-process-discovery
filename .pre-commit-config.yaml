# Mirrors the `quality` job in CI so failures show up before pushing.
# `uv run pre-commit install` installs both hook types; the commit-msg one is hard rule 8.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      # Hard rule 6. frontend/AGENTS.md is written and re-added by `next dev`.
      - id: no-em-dash
        name: no em dash in docs
        entry: "—"
        language: pygrep
        files: \.(md|toml)$
        exclude: ^frontend/AGENTS\.md$
      # Hard rule 8. CI runs the same script on the pull request body and its commits.
      - id: no-ai-credit
        name: no AI credit in the commit message
        entry: uv run python scripts/check_ai_credit.py --message-file
        language: system
        stages: [commit-msg]
