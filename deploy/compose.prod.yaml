# Production stack for the public demo (ADR 0008). Copied to /opt/apd/compose.yaml on the
# VPS, next to a .env made from deploy/.env.example:
#   cd /opt/apd && docker compose up -d
# The host Nginx is the only way in: the API and the web client listen on 127.0.0.1,
# PostgreSQL on no port. Each service runs its own version (ADR 0016): APD_VERSION for the
# API and APD_WEB_VERSION for the web client, both kept in .env by deploy.sh.
# CI starts this file in the `docker` job with the freshly built image.

name: apd

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    # Pinned by digest, so a pull never brings different bits under the same tag.
    # Dependabot proposes the next minor (ADR 0010). A major cannot read this data volume:
    # it ships as planned work with a dump and a restore.
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_USER: apd
      POSTGRES_DB: apd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apd"]
      interval: 10s
      timeout: 5s
      retries: 10
    # The entrypoint starts as root to own the data directory, then drops to the postgres
    # user, so capabilities stay; this only blocks gaining privileges after that.
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

  api:
    image: ${APD_IMAGE:-ghcr.io/sebastianlazarte/ai-process-discovery}:${APD_VERSION:?set APD_VERSION in .env}
    restart: unless-stopped
    # The published port is bound to 127.0.0.1, so only processes on the host (Nginx)
    # reach it. That is why every forwarding address is trusted.
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment:
      DATABASE_URL: postgresql+psycopg://apd:${POSTGRES_PASSWORD}@postgres:5432/apd
      # Alembic owns the schema (RS-59): `docker compose run --rm api alembic upgrade head`
      # runs before a new version starts, and the API never creates tables itself.
      CREATE_SCHEMA_ON_STARTUP: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      LLM_DAILY_LIMIT: ${LLM_DAILY_LIMIT:-50}
      PUBLIC_DEMO: "true"
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8100:8000"
    # `edge` gives outbound access to the LLM provider; `internal` reaches PostgreSQL.
    networks: [edge, internal]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy

  # The Next.js client (ADR 0016, RS-79). Nginx sends every path outside /api/ here.
  web:
    image: ${APD_WEB_IMAGE:-ghcr.io/sebastianlazarte/ai-process-discovery-web}:${APD_WEB_VERSION:?set APD_WEB_VERSION in .env}
    restart: unless-stopped
    environment:
      # Server-side reads go straight to the API container.
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:8101:3000"
    # `edge` reaches the API container and lets Docker publish the port; the web client
    # never talks to PostgreSQL.
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
      - /app/.next/server/route-cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    depends_on:
      api:
        condition: service_healthy

networks:
  edge:
  internal:
    internal: true

volumes:
  pgdata:
