# Public demo site (ADR 0008, RS-65), for the Nginx that already runs on the host.
# Install as /etc/nginx/sites-available/apd.conf with the real host name in place of
# apd.example.com, after the certificate exists (see docs/runbook/production.md):
#   sudo ln -s /etc/nginx/sites-available/apd.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Names start with apd_ because zones and map variables are shared by every site on the
# host, including n8n and the website.

# Analysis runs are the only requests that can reach the LLM provider: 10 per minute per
# client IP, counted for POST only (an empty key is not limited).
map $request_method $apd_analysis_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $apd_analysis_key zone=apd_analyses:10m rate=10r/m;

# Everything else: generous for a person clicking through, tight for a flood.
limit_req_zone $binary_remote_addr zone=apd_general:10m rate=10r/s;

# Security headers that the upstream response lacks. The web client already sends a strict
# CSP, nosniff and Referrer-Policy (src/app/api/routes/web.py), and the Next.js frontend
# will send a CSP with a nonce (ADR 0009), so Nginx only fills the gaps and no response
# carries a header twice. API responses and the docs pages get framing denied; Swagger UI
# and ReDoc load from a CDN and run an inline script, so a stricter policy would break them.
# An empty value makes add_header send nothing.
map $upstream_http_content_security_policy $apd_csp {
    ""      "frame-ancestors 'none'";
    default "";
}
map $upstream_http_x_content_type_options $apd_nosniff {
    ""      "nosniff";
    default "";
}
map $upstream_http_referrer_policy $apd_referrer_policy {
    ""      "no-referrer";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name apd.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apd.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/apd.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apd.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers on every response, errors included. A location that sets its own
    # add_header inherits none of these, so no location here sets one.
    # No includeSubDomains: other subdomains of the same domain are not managed here.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy $apd_csp always;
    add_header X-Content-Type-Options $apd_nosniff always;
    add_header Referrer-Policy $apd_referrer_policy always;

    # Every response here is proxied, and Nginx skips proxied responses unless gzip_proxied
    # says otherwise. No cookie, token or secret travels in a response, so a BREACH-style
    # attack on the compression has nothing to extract.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css
               image/svg+xml text/markdown;

    # Largest valid request is a process with 50 steps, far below this.
    client_max_body_size 256k;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: the API trusts this header, and a client could send its own.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~ ^/processes/[^/]+/analyses$ {
        # A location with its own limit_req does not inherit the server ones: list both.
        limit_req zone=apd_general burst=40 nodelay;
        limit_req zone=apd_analyses burst=5 nodelay;
        # The LLM call may take LLM_TIMEOUT_SECONDS (60) times 1 + LLM_MAX_RETRIES (2).
        proxy_read_timeout 200s;
        proxy_pass http://127.0.0.1:8100;
    }

    location / {
        limit_req zone=apd_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:8100;
    }
}
