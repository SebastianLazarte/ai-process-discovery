# The edge service of compose.yaml (ADR 0016, RS-79): plain HTTP on :8080 in front of the
# api and web containers, with the same routes as the host site, so CI and the end-to-end
# tests (RS-78) exercise the routing production uses. TLS, the security headers and the
# host name belong to the host site (apd.conf) and are left out here.

limit_req_zone $binary_remote_addr zone=apd_general:10m rate=10r/s;

map $request_method $apd_analysis_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $apd_analysis_key zone=apd_analyses:10m rate=10r/m;

upstream apd_api {
    server api:8000;
}
upstream apd_web {
    server web:3000;
}

server {
    listen 8080;
    server_tokens off;

    client_max_body_size 256k;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    include /etc/nginx/snippets/apd-routes.conf;
}
