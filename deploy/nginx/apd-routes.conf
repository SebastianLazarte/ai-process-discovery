# Routes of the public demo from 2.0.0 (ADR 0016, RS-79): FastAPI under /api/, Next.js
# everywhere else, and the retired /ui/ sends visitors to the new client.
#
# Included by the host site (apd.conf) and by the edge service of compose.yaml, so the
# end-to-end tests run against the routing production uses. On the host it lives in
# /etc/nginx/snippets/apd-routes.conf. The file that includes it defines:
#   upstreams apd_api (FastAPI) and apd_web (Next.js),
#   limit_req zones apd_general and apd_analyses, and the proxy headers.
#
# No location sets add_header: one that did would drop the security headers of the server.

# Analysis runs are the only requests that reach the LLM provider: their own rate limit,
# and a read timeout above LLM_TIMEOUT_SECONDS (60) times 1 + LLM_MAX_RETRIES (2).
location ~ ^/api/processes/[^/]+/analyses$ {
    # A location with its own limit_req does not inherit others: list both.
    limit_req zone=apd_general burst=40 nodelay;
    limit_req zone=apd_analyses burst=5 nodelay;
    proxy_read_timeout 200s;
    proxy_pass http://apd_api;
}

location /api/ {
    limit_req zone=apd_general burst=40 nodelay;
    proxy_pass http://apd_api;
}

# The vanilla client is retired in 2.0.0: old links land on the home page of the new one.
location ~ ^/ui(/|$) {
    return 301 /;
}

# Hashed, immutable files: the first load of a page fetches many at once, so a larger
# burst. Next.js sends their long Cache-Control itself.
location /_next/static/ {
    limit_req zone=apd_general burst=200 nodelay;
    proxy_pass http://apd_web;
}

location / {
    limit_req zone=apd_general burst=40 nodelay;
    proxy_pass http://apd_web;
}
