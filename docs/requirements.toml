acceptance = ["Header test on /ui/ and /docs"]

[[requirement]]
id = "RS-49"
ru = "RU-01"
block = "B10"
area = "ui"
title = "The client calls only public API routes, and only from api.js"
acceptance = ["Every endpoint in api.js exists in app.openapi()", "No other file in web/ contains fetch("]

[[requirement]]
id = "RS-50"
ru = "RU-04"
block = "B10"
area = "ui"
title = "The client never computes a metric; unknown values show as unknown, never 0"
acceptance = ["node:test on format.js", "parseFloat, parseInt and Number( appear only in format.js"]

[[requirement]]
id = "RS-51"
ru = "RU-01"
block = "B10"
area = "ui"
title = "Every interpolated value goes through h()"
acceptance = ["node:test: a process named <img onerror> renders escaped in every view"]

[[requirement]]
id = "RS-52"
ru = "RU-01"
block = "B10"
area = "ui"
title = "Load demos, create and delete processes, add, edit, reorder and delete steps"
acceptance = ["Browser walkthrough with screenshots in the B10 pull request"]

[[requirement]]
id = "RS-53"
ru = "RU-03"
block = "B10"
area = "ui"
title = "Results in four separate panels with rules version, prompt version and LLM status"
