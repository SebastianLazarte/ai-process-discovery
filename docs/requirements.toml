[[requirement]]
id = "RS-59"
ru = "RU-10"
block = "B11"
area = "infra"
kind = "story"
title = "Schema changes ship as Alembic migrations"
as_a = "maintainer"
i_want = "schema changes to ship as Alembic migrations that run before a new version starts"
so_that = "a release never breaks or silently changes the live database"
points = 5
priority = "must"
rank = 3

[[requirement.criteria]]
given = "a PostgreSQL database in CI"
when = "alembic upgrade head and then alembic check run"
then = "both succeed with no pending changes"

[[requirement.criteria]]
given = "create_schema_on_startup is false"
when = "the API starts on an empty database"
then = "no table is created"

[[requirement.criteria]]
given = "the live database created by create_all"
when = "it is stamped with alembic stamp head"
then = "the next upgrade applies nothing"

[[requirement]]
id = "RS-60"
ru = "RU-10"
block = "B11"
area = "api"
title = "Request limits on steps per process, text lengths and list sizes"
acceptance = ["A process over the step limit returns 422 naming the field", "An oversized description or list returns 422 naming the field"]

[[requirement]]
id = "RS-61"
ru = "RU-10"
block = "B11"
area = "llm"
title = "Daily LLM quota: past the limit the provider is not called and llm_status=unavailable with error_kind=daily_quota"
acceptance = ["The fake provider records no call once the limit is reached", "Deterministic results are identical with and without the quota hit"]

[[requirement]]
id = "RS-62"
ru = "RU-09"
block = "B11"
area = "ui"
title = "Public demo mode: the API reports it and the client shows a banner that data is public and deleted daily"
acceptance = ["The metadata endpoint returns version and public_demo", "node:test: the banner renders only when public_demo is true"]

[[requirement]]
id = "RS-63"
ru = "RU-10"
block = "B11"
area = "infra"
kind = "story"
title = "Purge command for expired demo data"
as_a = "maintainer"
i_want = "a command that deletes processes older than the retention window, with their analyses and overrides"
so_that = "the demo keeps the promise on its banner that data is deleted daily"
points = 3
priority = "must"
rank = 1

[[requirement.criteria]]
given = "processes older and newer than the retention window"
when = "the purge command runs"
then = "only the older ones are deleted, with their analyses and overrides"

[[requirement.criteria]]
given = "the running API"
when = "any HTTP route is called"
then = "none of them triggers a purge"

[[requirement]]
id = "RS-64"
ru = "RU-10"
block = "B11"
area = "infra"
title = "Production compose: API on 127.0.0.1 only, internal PostgreSQL, resource limits, read-only root, rotated logs, trusted proxy headers"
acceptance = ["CI validates deploy/compose.prod.yaml with docker compose config", "No service publishes a port on 0.0.0.0"]

[[requirement]]
id = "RS-65"
ru = "RU-10"
block = "B11"
area = "infra"
title = "Nginx site with TLS, a rate limit on analysis runs, a request body limit and a read timeout above the LLM timeout"
acceptance = ["nginx -t passes for deploy/nginx/apd.conf in CI with test certificates", "A burst over the limit returns 429 in the go-live check"]

[[requirement]]
id = "RS-66"
ru = "RU-10"
block = "B11"
area = "infra"
kind = "story"
title = "deploy.sh deploys one validated tag: backup, pull, migrate, start, health check, automatic rollback"
as_a = "maintainer"
i_want = "deploy.sh to deploy one validated tag (backup, pull, migrate, start, health check)"
so_that = "a bad release rolls back on its own instead of leaving the demo down"
points = 5
priority = "must"
rank = 4

[[requirement.criteria]]
given = "a tag outside vX.Y.Z"
when = "deploy.sh runs"
then = "it exits with an error and the running version is untouched"

[[requirement.criteria]]
given = "a valid tag"
when = "deploy.sh runs"
then = "it backs up the database and runs alembic upgrade head before starting the new version"

[[requirement.criteria]]
given = "a new version whose health check fails"
when = "deploy.sh runs"
then = "the previous tag runs again and the script exits with an error"

[[requirement.criteria]]
given = "a pull request"
when = "CI runs"
then = "shellcheck passes on deploy.sh"

[[requirement]]
id = "RS-67"
ru = "RU-10"
block = "B11"
area = "infra"
kind = "story"
title = "A release deploys over SSH with a forced-command key and a pinned host key, then runs an HTTPS smoke test"
as_a = "maintainer"
i_want = "a merged release to deploy itself over SSH and check the live site"
so_that = "shipping needs no manual step and a broken deploy is visible at once"
points = 3
priority = "must"
rank = 5

[[requirement.criteria]]
given = "a published release"
when = "the release workflow runs"
then = "the deploy job runs only in the production environment, over SSH with the pinned host key"

[[requirement.criteria]]
given = "the deploy finished"
when = "the smoke test runs"
then = "it checks /health and /ui/ over HTTPS and fails the job on any error"

[[requirement]]
id = "RS-68"
ru = "RU-10"
block = "B11"
area = "infra"
kind = "story"
title = "Nightly backup and purge with a rehearsed restore"
as_a = "maintainer"
i_want = "nightly backups and purges from systemd timers, with a rehearsed restore"
so_that = "a lost database costs at most one day of demo data"
points = 5
priority = "must"
rank = 6

[[requirement.criteria]]
given = "last night's backup"
when = "it is restored into a scratch database"
then = "the runbook records the restore and its date"

[[requirement.criteria]]
given = "the systemd timers on the host"
when = "a night passes"
then = "a new backup exists, backups older than 7 days are gone and expired processes are purged"

[[requirement.criteria]]
given = "a reader of the repository"
when = "they open README and SECURITY.md"
then = "README points to the live demo through the Website link of the repository page, without its domain, and SECURITY.md describes its data policy"

