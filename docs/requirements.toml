id = "RS-46"
ru = "RU-01"
block = "B10"
area = "ui"
title = "FastAPI serves web/ at /ui/ and / redirects there; WEB_DIR is configurable and the API runs without it"
acceptance = ["/ui/ returns 200 text/html and / returns 307", "With a missing WEB_DIR, /health returns 200 and /ui/ returns 404"]

[[requirement]]
id = "RS-47"
ru = "RU-01"
block = "B10"
area = "ui"
