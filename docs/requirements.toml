# Product backlog, one GitHub issue per requirement (scripts/bootstrap_github.py).
#
# Scrum mapping: each user requirement (RU) is an epic written as a user story, each system
# requirement (RS) is a backlog item (a user story or an enabler), and each block (B0 to B19)
# is a release with its milestone. Refined items carry Given/When/Then criteria, Fibonacci
# points, a MoSCoW priority and a rank; items delivered before refinement keep their
# original title and acceptance list. Status and sprint live in GitHub, not here.

[product]
goal = "A live, production-grade demo that shows how to build AI-assisted software people can trust: code computes every number, the AI only interprets, and the engineering holds up from backend to frontend to delivery."
sprint_days = 7
first_sprint = 2026-10-14
# Who the stories are written for (PDR 002).
roles = ["operations lead", "demo visitor", "maintainer"]

[user_requirements.RU-01]
name = "Process modelling"
as_a = "operations lead"
i_want = "to describe a process and its steps with the attributes needed to analyse it"
so_that = "the analysis starts from how the work is really done"

[user_requirements.RU-02]
name = "Current cost baseline"
as_a = "operations lead"
i_want = "to know how much time and money the process consumes today"
so_that = "I can size the opportunity before investing in automation"

[user_requirements.RU-03]
name = "Automation recommendation"
as_a = "operations lead"
i_want = "to know which steps are worth automating, with which method and why"
so_that = "I can decide where to invest with a rationale I can defend"

[user_requirements.RU-04]
name = "Trustworthy AI interpretation"
as_a = "operations lead"
i_want = "an AI-assisted interpretation that cannot change computed facts"
so_that = "I get extra insight without losing trust in the numbers"

[user_requirements.RU-05]
name = "Human override"
as_a = "operations lead"
i_want = "to correct a recommendation while keeping the original and the reason"
so_that = "my judgement prevails and every change stays auditable"

[user_requirements.RU-06]
name = "Business case"
as_a = "operations lead"
i_want = "to estimate economic impact from explicit, editable assumptions"
so_that = "I can defend the investment to whoever approves the budget"

[user_requirements.RU-07]
name = "Implementation blueprint"
as_a = "operations lead"
i_want = "an exportable technical blueprint"
so_that = "the team that builds the automation can estimate it and start from it"

[user_requirements.RU-08]
name = "Analysis history"
as_a = "operations lead"
i_want = "to see the analysis history of a process and why results differ"
so_that = "I can explain how the recommendation changed over time"

[user_requirements.RU-09]
name = "Public demo"
as_a = "demo visitor"
i_want = "to try the product on a public URL without installing anything or signing up"
so_that = "I can judge it in a few minutes"

[user_requirements.RU-10]
name = "Safe demo operations"
as_a = "maintainer"
i_want = "the public demo to protect the API budget, visitor data and the shared host"
so_that = "running it costs nothing unexpected and puts nothing else at risk"

[user_requirements.RU-11]
name = "Modern web interface"
as_a = "operations lead"
i_want = "a fast, accessible and secure web interface"
so_that = "I can work through an analysis on any device without friction"

[user_requirements.RU-12]
name = "Code that stays trustworthy"
as_a = "maintainer"
i_want = "automated quality gates and a clean core around the code agents write"
so_that = "a change can merge with confidence without reading every line by hand"

[user_requirements.RU-13]
name = "Guided process capture"
as_a = "operations lead"
i_want = "to start from the most common processes of my sector"
so_that = "I map a process in minutes instead of filling every field by hand"

[user_requirements.RU-14]
name = "AI-drafted process from a description"
as_a = "operations lead"
i_want = "the AI to draft the steps of a process I describe in my own words"
so_that = "I can map a process the catalog does not cover, while the public demo stays safe and affordable"

[user_requirements.RU-15]
name = "Modern interface"
as_a = "demo visitor"
i_want = "a clear, modern interface that shows the answer first"
so_that = "I trust the product within seconds"

