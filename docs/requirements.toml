[[requirement]]
id = "RS-54"
ru = "RU-04"
block = "B10"
area = "ui"
title = "With the LLM on and sensitive steps, the run button stays disabled until confirmed; a 409 shows as a notice"
acceptance = ["node:test on the analysis view", "Browser walkthrough"]

[[requirement]]
id = "RS-55"
ru = "RU-05"
block = "B10"
area = "ui"
title = "Override with a required reason, analysis history and blueprint with .md download"
acceptance = ["Browser walkthrough", "An override without reason marks the field"]

[[requirement]]
id = "RS-56"
ru = "RU-01"
block = "B10"
area = "ui"
title = "API errors show in a toast; a 422 marks the affected form field"
acceptance = ["node:test on error mapping for domain and validation errors"]

[[requirement]]
id = "RS-57"
ru = "RU-01"
block = "B10"
area = "ui"
