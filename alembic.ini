# Alembic migrations (ADR 0008, RS-59). The database URL comes from DATABASE_URL through
# the application settings, so no secret lives here.
#   uv run alembic upgrade head
# In production a one-off container from the release image runs it before the new
# version starts: docker compose run --rm api alembic upgrade head

[alembic]
script_location = %(here)s/src/app/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
