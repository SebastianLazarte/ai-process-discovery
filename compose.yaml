# Full stack: PostgreSQL + API (web client at :8000/ui/) + Next.js client + Streamlit UI,
# and the edge Nginx on :8080 with the production routes (ADR 0016, RS-79).
#   docker compose up --build
# CI runs this file in the `docker` job with freshly built images (APD_IMAGE, APD_WEB_IMAGE).

services:
  db:
    # Same pin as deploy/compose.prod.yaml, so CI starts the PostgreSQL that production runs.
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: apd
      POSTGRES_PASSWORD: apd
      POSTGRES_DB: apd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apd"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${APD_IMAGE:-ai-process-discovery:local}
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://apd:apd@db:5432/apd
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # The Next.js client at :3000/app (ADR 0009, RS-77), read-only like the production API:
  # Next writes only to its two caches, on tmpfs. Server-side reads reach the API at
  # API_INTERNAL_URL. Through the edge on :8080, the browser's /api/ calls reach the API too.
  web:
    image: ${APD_WEB_IMAGE:-ai-process-discovery-web:local}
    build: frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
      - /app/.next/server/route-cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy

  # The routes of the public demo (deploy/nginx/apd-routes.conf) in front of api and web:
  # /api/ to FastAPI, /ui/ answers 301 to /, every other path to Next.js. Until 2.0.0 the
  # client still lives under /app (ADR 0016), so open :8080/app.
  edge:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    volumes:
      - ./deploy/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/apd-routes.conf:/etc/nginx/snippets/apd-routes.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  ui:
    image: ${APD_IMAGE:-ai-process-discovery:local}
    command:
      - streamlit
      - run
      - ui/streamlit_app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
