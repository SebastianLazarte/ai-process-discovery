# Checklist posted on each pull request by .github/workflows/pr-checklist.yml.
#
# An area applies when a changed file starts with one of its `paths`. Each item says
# what to check, why it matters and where the rule lives (`ref`: a repo path or a URL).
# Only list what a reviewer has to judge: anything CI can enforce belongs in a check.

[always]
title = "Every pull request"

[[always.item]]
text = "Links the issue (`Closes #n`) or names the requirement (`RS-nn`)"
why = "Each change traces back to a requirement, and the issue closes on merge."
ref = "docs/requirements.toml"

[[always.item]]
text = "Docs that describe the changed code still hold, including the area's `CLAUDE.md`"
why = "Docs go stale silently, and reviewers and agents read them before the code."
ref = "docs/CLAUDE.md"

[verification]
default = ["What did you run, and what did you observe?"]
feat = [
  "Which test covers each acceptance criterion of the issue?",
  "Did you try it in the running app (`uv run uvicorn app.main:app --reload`)?",
]
fix = [
  "Which test failed before the fix and passes now?",
  "What was the root cause, and can it happen anywhere else?",
]
refactor = ["Which existing tests show the behaviour did not change? Did any of them need editing?"]
perf = ["What did you measure, and what were the numbers before and after?"]
test = ["Did you see the new test fail once, for the right reason?"]
docs = ["Did you run the commands and open the links you changed?"]
ci = ["How did the workflow run: on this pull request, as a dry run, or not yet, and why?"]
build = ["Did the image build and the compose stack become healthy locally?"]
chore = ["What changed, and why is it safe without new tests?"]

[[area]]
id = "domain"
title = "Domain"
paths = ["src/app/domain/"]

[[area.item]]
text = "No framework, ORM, SDK or Pydantic import"
why = "Business rules stay testable without infrastructure (Clean Architecture dependency rule). `test_boundaries.py` enforces it."
ref = "tests/unit/test_boundaries.py"

[[area.item]]
text = "Money and rates stay `Decimal`; rounding happens only in `present_*` helpers"
why = "Floats lose cents, and rounding early compounds errors across a calculation."
ref = "src/app/domain/decimals.py"

[[area.item]]
text = "A change to weights or thresholds ships as a new `ScoringPolicy` version"
why = "Every analysis stores the rules version it ran with, so old results stay reproducible."
ref = "src/app/domain/policies.py"

[[area.item]]
text = "Entities hold facts only; derived values are computed in `metrics`, `scoring` or `business_case`"
why = "One source of truth per figure: a stored total can disagree with its inputs, a computed one cannot."
ref = "src/app/domain/entities.py"

[[area]]
id = "llm"
title = "LLM layer"
paths = ["src/app/llm/"]

[[area.item]]
text = "The output schema gains no field for hours, cost, score, savings, payback or ROI"
why = "The LLM interprets and Python computes every number (deterministic first)."
ref = "docs/adr/0001-deterministic-first-analysis.md"

[[area.item]]
text = "The LLM can raise a human control, never lower it"
why = "Fail-safe default: an unsure model makes a step more supervised, never less."
ref = "src/app/domain/reconciliation.py"

[[area.item]]
text = "A prompt change bumps `PROMPT_VERSION`"
why = "Each analysis records its prompt version, so a result traces back to the exact prompt."
ref = "src/app/llm/prompts.py"

[[area.item]]
text = "No prompt or step description reaches the logs"
why = "Step descriptions can hold sensitive business data."
ref = "CONTRIBUTING.md"

[[area]]
id = "api"
title = "HTTP contracts"
paths = ["src/app/api/", "src/app/models/schemas/"]

[[area.item]]
text = "A breaking contract change carries `!` in the title"
why = "release-please bumps the major version only when the title says so, and clients rely on it."
ref = "docs/adr/0006-github-flow-ci-and-releases.md"

[[area.item]]
text = "`ENDPOINTS` in `web/api.js` still matches the routes"
why = "The web client breaks first when a route moves; `test_web_client.py` checks it against the OpenAPI schema."
ref = "tests/unit/test_web_client.py"

[[area.item]]
text = "Domain, contract and persistence models stay separate"
why = "A field added for the API does not leak into the database or the rules."
ref = "docs/adr/0003-separate-domain-contracts-persistence.md"

[[area]]
id = "persistence"
title = "Persistence"
paths = ["src/app/models/persistence/", "src/app/repositories/", "src/app/core/db.py"]

[[area.item]]
text = "Works on SQLite and PostgreSQL"
why = "Local runs use SQLite and production uses PostgreSQL; `test-postgres` runs the same suite."
ref = "docs/adr/0002-sqlite-locally-postgresql-in-ci.md"

[[area.item]]
text = "Money columns use `ExactDecimal`"
why = "SQLite has no exact decimal type; the decorator stores the exact value."
ref = "src/app/models/persistence/base.py"

[[area]]
id = "web"
title = "Web client"
paths = ["web/", "src/app/api/routes/web.py"]

[[area.item]]
text = "Every interpolated value goes through `h()`"
why = "Escaping output prevents cross-site scripting (OWASP XSS prevention)."
ref = "web/views.js"

[[area.item]]
text = "Only `api.js` calls `fetch`"
why = "One gateway to the API keeps errors, paths and the endpoint list in one place."
ref = "web/api.js"

[[area.item]]
text = "The client computes no metric"
why = "Figures come from the API, so the browser can never disagree with the backend."
ref = "docs/adr/0007-vanilla-web-client-served-by-fastapi.md"

[[area.item]]
text = "A new file in `web/` is listed in `WEB_FILES`"
why = "Files are served by name from an allowlist, never by directory."
ref = "src/app/api/routes/web.py"

[[area]]
id = "frontend"
title = "Next.js client"
paths = ["frontend/"]

[[area.item]]
text = "The client computes no metric, and only `src/lib/format` turns figures into text"
why = "Figures come from the API, so the browser can never disagree with the backend. Lint cannot see arithmetic on API values."
ref = "docs/adr/0009-nextjs-frontend-as-separate-service.md"

[[area.item]]
text = "A new package is named in ADR 0009 or ADR 0013, or comes with its own ADR"
why = "Every dependency is a decision with a maintenance cost (ADR 0010)."
ref = "docs/adr/0010-dependency-update-policy.md"

[[area]]
id = "ci"
title = "CI and repository"
paths = [".github/", "scripts/", "release-please-config.json"]

[[area.item]]
text = "Actions are pinned by full commit SHA"
why = "A tag can be moved to other code, a SHA cannot (supply chain security)."
ref = "docs/adr/0006-github-flow-ci-and-releases.md"

[[area.item]]
text = "A new or renamed required job is updated in `REQUIRED_CHECKS`, the live ruleset, ADR 0006 and `CONTRIBUTING.md`"
why = "A required check that no job reports blocks every pull request."
ref = "scripts/bootstrap_github.py"

[[area.item]]
text = "Untrusted input (pull request title, branch name) reaches `run` through `env`, never through `${{ }}`"
why = "Expressions are pasted into the script before the shell runs it, which allows script injection."
ref = "https://docs.github.com/en/actions/reference/security/secure-use"

[[area.item]]
text = "Each job asks for the least permissions it needs"
why = "A compromised step can only do what its token allows."
ref = "https://docs.github.com/en/actions/reference/security/secure-use"

[[area]]
id = "deps"
title = "Dependencies"
paths = ["pyproject.toml", "uv.lock"]

[[area.item]]
text = "A new dependency comes with an ADR"
why = "Every dependency is code you trust and maintain; the ADR records why it earns its place."
ref = "docs/CLAUDE.md"

[[area.item]]
text = "`uv.lock` was regenerated with `uv lock`, not edited by hand"
why = "The lock file pins exact versions and hashes; a hand edit can pass review and break installs."
ref = "pyproject.toml"

[[area]]
id = "deploy"
title = "Deployment"
paths = ["Dockerfile", "compose.yaml", "deploy/", ".env.example"]

[[area.item]]
text = "Secrets come from the environment, never from a committed file"
why = "Anything committed to a public repository stays public, even after it is deleted."
ref = ".env.example"

[[area.item]]
text = "The production runbook still matches"
why = "The runbook is what gets followed under pressure, so it has to be right before it is needed."
ref = "docs/runbook/production.md"

[[area]]
id = "docs"
title = "Decisions and docs"
paths = ["docs/adr/", "docs/pdr/", "docs/runbook/", "README.md", "CONTRIBUTING.md"]

[[area.item]]
text = "The decision index in `docs/CLAUDE.md` is updated"
why = "The index is how readers find a decision without opening every record."
ref = "docs/CLAUDE.md"

[[area.item]]
text = "An accepted record is amended by a new one, not rewritten"
why = "The history of decisions stays readable: what was decided, when, and what replaced it."
ref = "docs/CLAUDE.md"

[[area.item]]
text = "The writing style holds: no em dash, no \"it's not X, it's Y\""
why = "One voice across the docs (hard rule 6)."
ref = "CLAUDE.md"

[[area]]
id = "requirements"
title = "Requirements"
paths = ["docs/requirements.toml"]

[[area.item]]
text = "Every requirement has acceptance criteria"
why = "A requirement without acceptance criteria cannot be verified."
ref = "tests/unit/test_requirements_file.py"

[[area.item]]
text = "New requirements get their issue by re-running `bootstrap_github.py`"
why = "One issue per requirement keeps the board and the requirements in sync."
ref = "scripts/bootstrap_github.py"
