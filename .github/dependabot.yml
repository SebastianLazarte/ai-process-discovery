# Dependency update policy (ADR 0010). Minor and patch updates arrive grouped once a week,
# after a cooldown; each major arrives in its own pull request and is planned as backlog
# work before it merges. Security updates skip the cooldown and arrive as soon as GitHub
# publishes an advisory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    commit-message:
      prefix: build
      include: scope
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The Python version is a decision (pyproject, CI matrix, image), never a bot update.
      # The 3.12-slim tag still receives Python patch releases on every image build.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # PostgreSQL is pinned by tag and digest in both compose files; one pull request moves
  # both, so CI keeps starting the version that production runs.
  - package-ecosystem: docker-compose
    directories: [/, /deploy]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      postgres:
        patterns: [postgres]
        group-by: dependency-name
