name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Shellcheck
        # Preinstalled on the Ubuntu runner (RS-66, RS-67).
        run: shellcheck deploy/*.sh
      - name: Writing style
        # Hard rule 6 (RS-102): the same pre-commit hook that runs locally.
        run: uv run pre-commit run no-em-dash --all-files

  # RS-70: the Next.js client (ADR 0009). Runs on every pull request so it can be required.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # RS-71: the types are generated from openapi.json, which a pytest check keeps equal
      # to the API (RS-69). A contract change without regenerated types fails here.
      - name: API types up to date
        run: |
          pnpm api:types
          git diff --exit-code -- src/lib/api/schema.d.ts             || { echo "::error::Run 'pnpm api:types' in frontend/ and commit src/lib/api/schema.d.ts"; exit 1; }
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format
      - name: Types
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - name: Tests (SQLite)
        run: >
          uv run pytest
          --cov --cov-report=term --cov-report=xml --cov-fail-under=95
          --junitxml=junit.xml
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage (Python ${{ matrix.python-version }})"
            echo
            uv run coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  test-postgres:
    name: test-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: apd
          POSTGRES_PASSWORD: apd
          POSTGRES_DB: apd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://apd:apd@localhost:5432/apd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      # RS-59: the migrations build the schema the models describe, on an empty database.
      - name: Migrations against PostgreSQL
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Integration tests against PostgreSQL
        run: uv run pytest tests/integration

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # RS-65, RS-79: the production Nginx site and the routes it includes parse, with a
      # throwaway certificate in the path that certbot uses on the server.
      - name: Nginx site config
        run: |
          live="$RUNNER_TEMP/letsencrypt/live/apd.example.com"
          mkdir -p "$live"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=apd.example.com" \
            -keyout "$live/privkey.pem" -out "$live/fullchain.pem"
          docker run --rm \
            -v "$PWD/deploy/nginx/apd.conf:/etc/nginx/conf.d/apd.conf:ro" \
            -v "$PWD/deploy/nginx/apd-routes.conf:/etc/nginx/snippets/apd-routes.conf:ro" \
            -v "$RUNNER_TEMP/letsencrypt:/etc/letsencrypt:ro" \
            nginx:stable nginx -t
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ai-process-discovery:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # RS-77: the Next.js client image. Its own cache scope, so the two builds do not
      # overwrite each other's layers.
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          push: false
          tags: ai-process-discovery-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      # `--wait` fails unless every service with a health check, web included, is healthy.
      - name: Compose smoke test
        env:
          APD_IMAGE: ai-process-discovery:ci
          APD_WEB_IMAGE: ai-process-discovery-web:ci
        run: |
          docker compose up -d --wait --wait-timeout 180
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q api)")" = healthy
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q web)")" = healthy
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/api/health
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3000/ \
            | grep -q '<title>AI Process Discovery</title>'
          # RS-80: the API answers under /api only; the root belongs to Next.js.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8000/health)" = 404
          # RS-79: the edge Nginx serves the production routes (deploy/nginx/apd-routes.conf).
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/api/health
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/ \
            | grep -q '<title>AI Process Discovery</title>'
          curl --silent --head http://localhost:8080/ui/app.js | tee /tmp/ui.txt
          grep -q '^HTTP/1.1 301' /tmp/ui.txt
          grep -Eiq '^location: (http://[^/]+)?/\s*$' /tmp/ui.txt
          # The web container runs as the node user on a read-only root.
          test "$(docker compose exec -T web id -u)" != 0
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$(docker compose ps -q web)")" = true
      # RS-64, RS-79: the production stack runs with the same images, a read-only root and no
      # capabilities, and publishes nothing beyond 127.0.0.1.
      - name: Production compose smoke test
        env:
          APD_IMAGE: ai-process-discovery
          APD_VERSION: ci
          APD_WEB_IMAGE: ai-process-discovery-web
          APD_WEB_VERSION: ci
          POSTGRES_PASSWORD: ci-only-password
          LLM_PROVIDER: fake
        run: |
          docker compose -f deploy/compose.prod.yaml config --quiet
          host_ips=$(docker compose -f deploy/compose.prod.yaml config --format json \
            | jq -r '.services[].ports[]? | .host_ip // "0.0.0.0"')
          echo "Published on: $host_ips"
          if echo "$host_ips" | grep -qv '^127\.0\.0\.1$'; then
            echo "::error::deploy/compose.prod.yaml publishes a port beyond 127.0.0.1"
            exit 1
          fi
          # The API creates no table here (RS-59): migrate first, as the runbook and deploy.sh (RS-66) do.
          docker compose -f deploy/compose.prod.yaml run --rm api alembic upgrade head
          docker compose -f deploy/compose.prod.yaml up -d --wait --wait-timeout 120
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8100/api/health
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8101/ \
            | grep -q '<title>AI Process Discovery</title>'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$(docker compose -f deploy/compose.prod.yaml ps -q web)")" = true
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs
          docker compose -f deploy/compose.prod.yaml logs || true
      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker compose -f deploy/compose.prod.yaml down -v || true

  # RS-78: the walkthroughs of the Next.js client (ADR 0009, ADR 0013), with axe at 1280 and
  # 375 px, against the compose stack behind its edge Nginx and the fake LLM provider. The
  # images build here as in `docker`, reading its layer cache without writing to it.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APD_IMAGE: ai-process-discovery:ci
      APD_WEB_IMAGE: ai-process-discovery-web:ci
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ai-process-discovery:ci
          cache-from: type=gha
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          push: false
          tags: ai-process-discovery-web:ci
          cache-from: type=gha,scope=web
      # The edge brings up db, api and web, and waits for their health checks.
      - name: Start the stack
        run: |
          docker compose up -d --wait --wait-timeout 180 edge
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8080/ > /dev/null
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps --only-shell chromium
      - name: Walkthroughs
        working-directory: frontend
        run: pnpm e2e
      # The web container runs on a read-only root: a write outside its tmpfs logs EROFS.
      # Only the app containers count: the Nginx entrypoint notes its own read-only config
      # mount on every start, and means no harm.
      - name: Read-only roots hold
        if: success() || failure()
        run: |
          if docker compose logs web api 2>&1 | grep -Ei 'EROFS|read-only file system'; then
            echo "::error::A container wrote outside its tmpfs on a read-only root"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
