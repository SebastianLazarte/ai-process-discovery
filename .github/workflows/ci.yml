name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Syntax
        run: for file in web/*.js web/tests/*.js; do node --check "$file"; done
      - name: Client tests
        run: node --test web/tests/*.test.js

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - name: Tests (SQLite)
        run: >
          uv run pytest
          --cov --cov-report=term --cov-report=xml --cov-fail-under=85
          --junitxml=junit.xml
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage (Python ${{ matrix.python-version }})"
            echo
            uv run coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  test-postgres:
    name: test-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: apd
          POSTGRES_PASSWORD: apd
          POSTGRES_DB: apd
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://apd:apd@localhost:5432/apd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Integration tests against PostgreSQL
        run: uv run pytest tests/integration

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # RS-65: the production Nginx site parses, with a throwaway certificate in the path
      # that certbot uses on the server.
      - name: Nginx site config
        run: |
          live="$RUNNER_TEMP/letsencrypt/live/apd.example.com"
          mkdir -p "$live"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=apd.example.com" \
            -keyout "$live/privkey.pem" -out "$live/fullchain.pem"
          docker run --rm \
            -v "$PWD/deploy/nginx/apd.conf:/etc/nginx/conf.d/apd.conf:ro" \
            -v "$RUNNER_TEMP/letsencrypt:/etc/letsencrypt:ro" \
            nginx:stable nginx -t
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ai-process-discovery:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose smoke test
        env:
          APD_IMAGE: ai-process-discovery:ci
        run: |
          docker compose up -d --wait --wait-timeout 120
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/health
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/ui/
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8501/_stcore/health
      # RS-64: the production stack runs with the same image, a read-only root and no
      # capabilities, and publishes nothing beyond 127.0.0.1.
      - name: Production compose smoke test
        env:
          APD_IMAGE: ai-process-discovery
          APD_VERSION: ci
          POSTGRES_PASSWORD: ci-only-password
          LLM_PROVIDER: fake
        run: |
          docker compose -f deploy/compose.prod.yaml config --quiet
          host_ips=$(docker compose -f deploy/compose.prod.yaml config --format json \
            | jq -r '.services[].ports[]? | .host_ip // "0.0.0.0"')
          echo "Published on: $host_ips"
          if echo "$host_ips" | grep -qv '^127\.0\.0\.1$'; then
            echo "::error::deploy/compose.prod.yaml publishes a port beyond 127.0.0.1"
            exit 1
          fi
          docker compose -f deploy/compose.prod.yaml up -d --wait --wait-timeout 120
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8100/health
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8100/ui/
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs
          docker compose -f deploy/compose.prod.yaml logs || true
      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker compose -f deploy/compose.prod.yaml down -v || true
