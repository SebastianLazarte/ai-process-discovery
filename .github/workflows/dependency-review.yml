name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Each exception names one advisory, why it is safe, and when it goes.
          # GHSA-vfj7-8cjw-p6xm: braces <= 3.0.3, denial of service through deeply nested
          # patterns, with no patched release yet. It reaches frontend/ only as a development
          # tool (eslint-config-next > fast-glob > micromatch > braces) that expands patterns
          # we write, and it ships in no image. Remove it once Dependabot brings a fix.
          allow-ghsas: GHSA-vfj7-8cjw-p6xm
