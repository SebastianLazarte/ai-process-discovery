name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No AI credit
        # Hard rule 8 (RS-102). The squash commit on main takes the pull request body, so the
        # body is checked with every commit. The script reads both through the API.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/check_ai_credit.py --repo "$REPO" --pr "$PR"
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            ci
            build
            chore
          scopes: |
            domain
            scoring
            business-case
            api
            persistence
            llm
            reconciliation
            blueprint
            ui
            ci
            deps
            deps-dev
            docs
            release
          requireScope: false
