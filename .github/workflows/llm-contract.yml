name: LLM contract (manual)

# Calls the real Anthropic API. It never runs on pull requests, so the secret
# is never exposed to forks. Trigger it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llm-contract:
    name: llm-contract
    runs-on: ubuntu-latest
    environment: llm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - name: Provider contract tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run pytest -m llm tests/provider -o addopts=""
