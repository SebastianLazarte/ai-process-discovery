name: PR checklist

# A guide, not a gate: posts one comment with the checklist for the areas a pull request
# touches (.github/pr-checklist.toml) and keeps it current on every push. Not a required
# check. pull_request_target lets it comment on pull requests from forks; it runs the base
# branch's code only and reads the pull request through the API, never checking it out.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checklist:
    name: checklist
    # Dependabot runs get a read-only token, and release pull requests need no checklist.
    if: github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Post or update the checklist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/pr_checklist.py --repo "$REPO" --pr "$PR"
