[project]
name = "ai-process-discovery"
version = "1.5.0"
description = "Turns a business process description into a quantified, explainable automation blueprint. Deterministic first, LLM at the edge."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Sebastian Lazarte" }]
dependencies = [
    "alembic>=1.20",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ui = ["httpx>=0.27", "streamlit>=1.38"]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.168",
    "mutmut>=3.8",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers -m 'not llm'"
markers = [
    "llm: calls a real LLM provider; run manually with `pytest -m llm`",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "T20", "C90", "PLR09"]

# Size and complexity limits (ADR 0011). Raising one needs a reason in review.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
# 7 until RS-84 splits the analysis service; then 5.
max-args = 7
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Legacy Streamlit client, pending removal (ADR 0007): no new features, no refactor.
"ui/streamlit_app.py" = ["C901", "PLR0912", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]

# Mutation testing (ADR 0011): the domain holds every business rule, so its tests are
# the ones measured. Run with `uv run mutmut run`; CI runs it weekly.
[tool.mutmut]
source_paths = ["src/app/domain/"]
also_copy = ["tests/", "src/"]
pytest_add_cli_args_test_selection = ["tests/unit/domain/"]
